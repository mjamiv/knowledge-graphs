<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Edges -->
  <line x1="50" y1="20" x2="20" y2="50" stroke="url(#grad)" stroke-width="3" opacity="0.6"/>
  <line x1="50" y1="20" x2="80" y2="50" stroke="url(#grad)" stroke-width="3" opacity="0.6"/>
  <line x1="20" y1="50" x2="35" y2="80" stroke="url(#grad)" stroke-width="3" opacity="0.6"/>
  <line x1="80" y1="50" x2="65" y2="80" stroke="url(#grad)" stroke-width="3" opacity="0.6"/>
  <line x1="35" y1="80" x2="65" y2="80" stroke="url(#grad)" stroke-width="3" opacity="0.6"/>
  <line x1="20" y1="50" x2="80" y2="50" stroke="url(#grad)" stroke-width="2" opacity="0.4"/>
  <!-- Nodes -->
  <circle cx="50" cy="20" r="10" fill="url(#grad)"/>
  <circle cx="20" cy="50" r="8" fill="#0ea5e9"/>
  <circle cx="80" cy="50" r="8" fill="#8b5cf6"/>
  <circle cx="35" cy="80" r="7" fill="#06b6d4"/>
  <circle cx="65" cy="80" r="7" fill="#a855f7"/>
</svg>
